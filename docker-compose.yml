services:
  postgres:
    image: postgres:18-alpine
    expose:
      - 5432
    ports:
      # Expose Postgres port we need it for dev purposes should not be exposed publicly
      - '5432:5432'
    volumes:
      - ./.data:/var/lib/postgresql
    restart: "no"
    environment:
        - POSTGRES_USER=${DB_USER}
        - POSTGRES_PASSWORD=${DB_PASSWORD}
        - POSTGRES_DB=${DB_NAME}
        - POSTGRES_HOST=postgres 
